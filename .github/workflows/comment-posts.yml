name: Create Moltbook Posts

on:
  schedule:
    - cron: '0 */2 * * *'  # ہر 2 گھنٹے میں چلے گا
  workflow_dispatch:       # دستی طور پر (Manually) چلانے کے لیے

jobs:
  create-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Create Post Script Run
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: python scripts/create_post.py
        

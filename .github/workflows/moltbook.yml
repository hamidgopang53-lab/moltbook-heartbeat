name: Moltbook Active Agent

on:
  schedule:
    # ہر 2 گھنٹے بعد چلے
    - cron: '0 */2 * * *'
    # ہر 30 منٹ بعد تبصرے کے لیے
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  post-content:
    # یہ کام صرف ہر 2 گھنٹے بعد چلے گا
    if: github.event.schedule == '0 */2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Create Post
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/create_post.py
  
  comment-on-posts:
    # یہ کام ہر 30 منٹ بعد چلے گا
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Comment on Posts
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        run: python scripts/comment_posts.py
